// Upbit 웹(www.upbit.com)이 쓰는 crix 웹소켓 스키마
// 출처: https://upbit-web-dist.upbit.com/upbit-web/sri-v2-chunk-D8xUTR8D.js (protobufjs static 코드)
// 2026-10-07 추출. 원본 패키지는 com.dunamu.crix.front.protobuf (+ .common 하위 패키지).
// 이 파일은 편의상 하나로 합쳤고, 필드 이름은 JS의 camelCase를 snake_case로 바꿨다.
//
// python -m grpc_tools.protoc -I. --python_out=. crix_upbit.proto : proto설치 명령어
//
// 프레임 형식 (ProtobufListLoader / ProtobufLoader):
//   [4바이트 big-endian 길이][1바이트 타입 ID][protobuf 본문] 이 반복됨. 길이 = 타입 1바이트 + 본문.
//   타입 ID -> 메시지:
//       0 = Forex
//       1 = RecentCrix
//       2 = CrixTrade
//       3 = CrixOrderbook
//       4 = CrixOrder
//       5 = ShortRecentCrix
//       6 = CrixEvent
//       7 = BaseCandle
//       8 = CrixAsset
//     126 = FrontError
//     127 = PingMessage
//
// 구독 요청 (JSON 텍스트):
//   [{"ticket":"..."},{"format":"PRTBUF_LIST"},{"type":"recentCrix","codes":["CRIX.UPBIT.KRW-BTC"]}, ...]
//   type: recentCrix, shortRecentCrix, crixTrade, crixOrderbook(+level), crixEvent, baseCandle, crixOrder, crixAsset
// protoc --python_out=. crix_upbit.proto

syntax = "proto3";

package com.dunamu.crix.front.protobuf;

import "google/protobuf/wrappers.proto";

// ===== enums (원본: .common) =====

enum AskBid {
  ASKUNKNOWN = 0;
  ASK = 1;
  BID = 2;
}

enum Change {
  CHANGEUNKNOWN = 0;
  UPPER_LIMIT = 1;
  RISE = 2;
  EVEN = 3;
  LOWER_LIMIT = 4;
  FALL = 5;
}

enum CrixMarketWarning {
  NONE = 0;
  CAUTION = 1;
  ALERT = 2;
  RISK = 3;
}

enum CrixMarketState {
  PREVIEW = 0;
  ACTIVE = 1;
  UNAVAILABLE = 2;
  PREDELISTING = 3;
  DELISTED = 4;
}

enum CrixOrderState {
  WAIT = 0;
  CANCEL = 1;
  DONE = 2;
  TRADE = 3;
  WATCH = 4;
  PREVENTED = 5;
}

enum StreamType {
  SNAPSHOT = 0;
  REALTIME = 1;
}

enum MarketEventType {
  MARKET_WARNING = 0;
  TRADING_SUSPENDED = 1;
  PRICE_FLUCTUATIONS = 2;
  TRADING_VOLUME_SOARING = 3;
  DEPOSIT_AMOUNT_SOARING = 4;
  GLOBAL_PRICE_DIFFERENCES = 5;
  CONCENTRATION_OF_SMALL_ACCOUNTS = 6;
  TRADE_FEE_STATE = 7;
  MEME = 8;
}

// 원본: .common
message FrontModelInfo {
  string code = 1;  // code
  StreamType stream_type = 2;  // streamType
  int64 timestamp = 3;  // timestamp
}

// 원본: .common
message PrivateFrontModelInfo {
  FrontModelInfo front_model_info = 1;  // frontModelInfo
  repeated string access_keys = 2;  // accessKeys
}

// 타입 ID 1
message RecentCrix {
  FrontModelInfo front_model_info = 1;  // frontModelInfo
  double trade_price = 2;  // tradePrice
  double opening_price = 3;  // openingPrice
  double high_price = 4;  // highPrice
  double low_price = 5;  // lowPrice
  double acc_trade_volume = 6;  // accTradeVolume
  double acc_trade_volume_24h = 7;  // accTradeVolume24h
  double acc_trade_price = 8;  // accTradePrice
  double acc_trade_price_24h = 9;  // accTradePrice24h
  uint32 trade_date = 10;  // tradeDate
  uint32 trade_time = 11;  // tradeTime
  AskBid ask_bid = 12;  // askBid
  Change change = 13;  // change
  double trade_volume = 14;  // tradeVolume
  int64 trade_timestamp = 15;  // tradeTimestamp
  double prev_closing_price = 16;  // prevClosingPrice
  float change_rate = 17;  // changeRate
  double change_price = 18;  // changePrice
  float signed_change_rate = 19;  // signedChangeRate
  double signed_change_price = 20;  // signedChangePrice
  bool is_trading_suspended = 21;  // isTradingSuspended
  double acc_ask_volume = 22;  // accAskVolume
  double acc_bid_volume = 23;  // accBidVolume
  double highest_52_week_price = 24;  // highest52WeekPrice
  uint32 highest_52_week_date = 25;  // highest52WeekDate
  double lowest_52_week_price = 26;  // lowest52WeekPrice
  uint32 lowest_52_week_date = 27;  // lowest52WeekDate
  CrixMarketState market_state = 28;  // marketState
  CrixMarketState market_state_for_ios = 29;  // marketStateForIOS
  uint32 delisting_date = 30;  // delistingDate
  CrixMarketWarning market_warning = 31;  // marketWarning
  string delisting_date_time = 32;  // delistingDateTime
}

// 타입 ID 5
message ShortRecentCrix {
  FrontModelInfo front_model_info = 1;  // frontModelInfo
  double trade_price = 2;  // tradePrice
  double opening_price = 3;  // openingPrice
  double high_price = 4;  // highPrice
  double low_price = 5;  // lowPrice
  double prev_closing_price = 6;  // prevClosingPrice
  double acc_trade_price_24h = 7;  // accTradePrice24h
  bool is_trading_suspended = 8;  // isTradingSuspended
  CrixMarketState market_state = 9;  // marketState
  CrixMarketWarning market_warning = 10;  // marketWarning
  AskBid ask_bid = 11;  // askBid
}

// 타입 ID 2
message CrixTrade {
  FrontModelInfo front_model_info = 1;  // frontModelInfo
  uint32 trade_date = 2;  // tradeDate
  uint32 trade_time = 3;  // tradeTime
  uint64 trade_timestamp = 4;  // tradeTimestamp
  double trade_price = 5;  // tradePrice
  double trade_volume = 6;  // tradeVolume
  AskBid ask_bid = 7;  // askBid
  double prev_closing_price = 8;  // prevClosingPrice
  Change change = 9;  // change
  double change_price = 10;  // changePrice
  uint64 sequential_id = 11;  // sequentialId
}

// 타입 ID 3
message CrixOrderbook {
  FrontModelInfo front_model_info = 1;  // frontModelInfo
  double total_ask_size = 2;  // totalAskSize
  double total_bid_size = 3;  // totalBidSize
  repeated CrixOrderbookUnit orderbook_units = 4;  // orderbookUnits
  double total_ask_price = 5;  // totalAskPrice
  double total_bid_price = 6;  // totalBidPrice
  double level = 7;  // level
}

message CrixOrderbookUnit {
  google.protobuf.DoubleValue ask_price = 1;  // askPrice
  google.protobuf.DoubleValue bid_price = 2;  // bidPrice
  google.protobuf.DoubleValue ask_size = 3;  // askSize
  google.protobuf.DoubleValue bid_size = 4;  // bidSize
}

// 타입 ID 6
message CrixEvent {
  FrontModelInfo front_model_info = 1;  // frontModelInfo
  repeated RecentMarketEvent market_events = 2;  // marketEvents
}

message RecentMarketEvent {
  MarketEventType event_type = 1;  // eventType
  string message = 2;  // message
  string link = 3;  // link
  string trigger_time_utc = 4;  // triggerTimeUtc
  string expiration_time_utc = 5;  // expirationTimeUtc
  string trigger_time_kst = 6;  // triggerTimeKst
  string expiration_time_kst = 7;  // expirationTimeKst
  repeated MarketEventDetail details = 8;  // details
  uint64 timestamp = 9;  // timestamp
  uint32 warning_level = 10;  // warningLevel
}

message MarketEventDetail {
  string name = 1;  // name
  string value = 2;  // value
}

// 타입 ID 7
message BaseCandle {
  FrontModelInfo front_model_info = 1;  // frontModelInfo
  uint64 candle_timestamp = 2;  // candleTimestamp
  uint64 last_sequential_id = 3;  // lastSequentialId
  double opening_price = 4;  // openingPrice
  double high_price = 5;  // highPrice
  double low_price = 6;  // lowPrice
  double trade_price = 7;  // tradePrice
  double trade_volume = 8;  // tradeVolume
  double acc_trade_price = 9;  // accTradePrice
}

// 타입 ID 0
message Forex {
  FrontModelInfo front_model_info = 1;  // frontModelInfo
  uint32 date = 2;  // date
  uint32 time = 3;  // time
  int32 recurrence_count = 4;  // recurrenceCount
  double base_price = 5;  // basePrice
  double opening_price = 6;  // openingPrice
  double high_price = 7;  // highPrice
  double low_price = 8;  // lowPrice
  Change change = 9;  // change
  double change_price = 10;  // changePrice
  double high_52w_price = 11;  // high52wPrice
  uint32 high_52w_date = 12;  // high52wDate
  double low_52w_price = 13;  // low52wPrice
  uint32 low_52w_date = 14;  // low52wDate
  double us_dollar_rate = 15;  // usDollarRate
}

// 타입 ID 4
message CrixOrder {
  PrivateFrontModelInfo front_model_info = 1;  // frontModelInfo
  AskBid ask_bid = 2;  // askBid
  double price = 3;  // price
  double volume = 4;  // volume
  string uuid = 5;  // uuid
  string order_type = 6;  // orderType
  CrixOrderState state = 7;  // state
  uint64 order_timestamp = 8;  // orderTimestamp
  string trade_uuid = 9;  // tradeUuid
  uint64 trade_timestamp = 10;  // tradeTimestamp
  string pocket_uuid = 11;  // pocketUuid
}

// 타입 ID 8
message CrixAsset {
  PrivateFrontModelInfo front_model_info = 1;  // frontModelInfo
  string asset_uuid = 2;  // assetUuid
  repeated AssetInfo assets = 3;  // assets
}

message AssetInfo {
  string currency = 1;  // currency
  string balance = 2;  // balance
  string locked = 3;  // locked
  string pocket_uuid = 4;  // pocketUuid
}

// 타입 ID 126
message FrontError {
  uint32 code = 1;  // code
  string message = 2;  // message
}

// 타입 ID 127
message PingMessage {
  string status = 1;  // status
}
